
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Keren</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
    <h2>KALKULATOR</h2>

    <div class="display">
        <input type="text" id="layar" value="0" readonly>
    </div>

    <div class="buttons">
        <button class="special" onclick="hapus()">AC</button>
        <button class="special" onclick="hapusSatu()">DEL</button>
        <button class="special" onclick="persen()">%</button>
        <button class="operator" onclick="pilihOperasi('/')">÷</button>

        <button onclick="masukkan('7')">7</button>
        <button onclick="masukkan('8')">8</button>
        <button onclick="masukkan('9')">9</button>
        <button class="operator" onclick="pilihOperasi('*')">×</button>

        <button onclick="masukkan('4')">4</button>
        <button onclick="masukkan('5')">5</button>
        <button onclick="masukkan('6')">6</button>
        <button class="operator" onclick="pilihOperasi('-')">−</button>

        <button onclick="masukkan('1')">1</button>
        <button onclick="masukkan('2')">2</button>
        <button onclick="masukkan('3')">3</button>
        <button class="operator" onclick="pilihOperasi('+')">+</button>

        <button onclick="masukkan('00')">00</button>
        <button onclick="masukkan('0')">0</button>
        <button onclick="masukkan('.')">.</button>
        <button class="equal" onclick="hitung()">=</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
